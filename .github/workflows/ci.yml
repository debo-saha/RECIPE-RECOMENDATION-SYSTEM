name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------
      # Backend
      # ------------------------------
      - name: Backend - Cache node modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Backend - Install dependencies
        run: |
          
            cd backend
            npm install
            npm ci

      - name: Backend - Test + Coverage (if configured)
        run: |
          if [ -d "backend" ]; then
            cd backend
            if grep -q "\"test\":" package.json; then
              npm test -- --coverage
            else
              echo "⚠️ No backend tests configured"
            fi
          fi
        continue-on-error: true

      # ------------------------------
      # Frontend
      # ------------------------------
      - name: Frontend - Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Frontend - Install dependencies
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install
            npm ci
          else
            echo "⚠️ frontend directory not found"
          fi

      - name: Frontend - Build (Next.js)
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            if grep -q "\"build\":" package.json; then
              npm run build
            else
              echo "⚠️ No frontend build script configured"
            fi
          fi

      - name: Verify Frontend Build Output
        run: |
          if [ -d "frontend/.next" ] || [ -d "frontend/out" ]; then
            echo "✅ Build output found"
          else
            echo "❌ Build output missing"
            exit 1
          fi
